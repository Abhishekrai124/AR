    <main class="auth-main"><section class="auth-card owner-card"><p class="eyebrow">Private owner studio</p><h1>Care for your <em>community.</em></h1><p class="auth-copy" id="ownerStatus">Checking secure owner access…</p><div id="ownerTools" hidden><div id="ownerAnalytics" class="owner-analytics"></div><button id="ownerSelf" class="button" type="button">Edit my unrestricted profile</button><label class="social-form">God Mode search<input id="ownerSearch" placeholder="Username or exact user ID" /></label><div id="ownerResults" class="people-results"></div><form id="ownerEditor" class="social-form owner-editor" hidden><p class="eyebrow">Selected member</p><p id="ownerRecord" class="owner-record"></p><input name="id" type="hidden" /><label>Name <input name="displayName" required /></label><label>Bio <textarea name="bio"></textarea></label><label>DOB <input name="dateOfBirth" type="date" /></label><label>Gender <select name="gender"><option value="">Not set</option><option value="woman">Woman</option><option value="man">Man</option><option value="non_binary">Non-binary</option><option value="prefer_not_to_say">Prefer not to say</option></select></label><label>Privacy <select name="privacy"><option value="public">Public</option><option value="private">Private</option></select></label><label>Rare custom username <input name="customUsername" disabled /><small id="vipUsernameHelp">Grant VIP to unlock this field.</small></label><button class="button primary" type="submit">Force save <b>↗</b></button><div class="owner-actions"><button class="follow-button" type="button" data-vip-toggle>Toggle VIP</button><button class="follow-button" type="button" data-status="active">Active</button><button class="follow-button" type="button" data-status="suspended">Suspend</button><button class="follow-button" type="button" data-status="banned">Ban</button><button class="follow-button" type="button" data-status="dismissed">Dismiss</button></div></form></div></section></main>
