<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Create an Arrai account or sign in to your local profile."
    />
    <title>Login / Register — arrai.in</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <div class="ambient one"></div>
    <div class="ambient two"></div>
    <header>
      <a class="brand" href="index.html">ar<span>rai</span>.in <b>✦</b></a>
      <button
        class="menu-button"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        ☰
      </button>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
        <a class="active" href="auth.html">Login / Register</a>
      </nav>
    </header>
    <main class="auth-main">
      <section class="auth-card" aria-labelledby="authTitle">
        <div class="auth-dream-mark" aria-hidden="true">✦</div>
        <p class="eyebrow">A gentle doorway to your ARRAI world</p>
        <h1 id="authTitle">Welcome <em>in.</em></h1>
        <p class="auth-copy">
          Sign in for your little corner, kind conversations and good things
          still waiting to happen.
        </p>
        <form class="auth-form" id="loginForm">
          <label
            >Email<input
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
          /></label>
          <label
            >Password<input
              name="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Your password"
          /></label>
          <button class="button primary" type="submit">Login <b>↗</b></button>
        </form>
        <form class="auth-form" id="signupForm" hidden>
          <label
            >Display name<input
              name="name"
              maxlength="50"
              required
              placeholder="Your name"
          /></label>
          <label
            >Email<input
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
          /></label>
          <label
            >Password<input
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="6"
              required
              placeholder="At least 6 characters"
          /></label>
          <button class="button primary" type="submit">
            Create account <b>✦</b>
          </button>
        </form>
        <form class="auth-form" id="resetForm" hidden>
          <label>New password<input name="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters" /></label>
          <button class="button primary" type="submit">Save new password <b>✦</b></button>
        </form>
        <div class="auth-actions">
          <button class="button" id="switchAuth" type="button">
            Create a new account</button
          ><button class="button" id="googleButton" type="button">
            Continue with Google</button
          ><button class="text-button auth-reset-button" id="resetPasswordButton" type="button" hidden>
            I forgot my password</button
          ><a
            class="button primary"
            id="communityButton"
            href="community.html"
            hidden
            >Open community <b>↗</b></a
          >
        </div>
        <p class="auth-status" id="authStatus" aria-live="polite"></p>
      </section>
    </main>
    <footer>
      <a class="brand" href="index.html">ar<span>rai</span>.in</a>
      <p>© 2026 Abhishek Rai. All rights reserved.</p>
      <div>
        <a href="privacy.html">Privacy</a><a href="privacy.html#terms">Terms</a>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
