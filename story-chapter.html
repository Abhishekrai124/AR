<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chapter Reader — arrai.in Chronicles</title>
    <link rel="icon" type="image/svg+xml" href="assets/app-icon.svg" />
    <link rel="alternate icon" href="assets/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/app-icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="chapter-reader-page">
    <div class="ambient one"></div>
    <div class="ambient two"></div>

    <header>
      <a class="brand" href="index.html">ar<span>rai</span>.in <b>✦</b></a>
      <button class="menu-button" aria-label="Open navigation" aria-expanded="false">☰</button>
      <nav>
        <a href="index.html">Home</a>
        <a class="active" href="stories.html">Stories & Lore</a>
        <a href="projects.html">Work</a>
        <a href="music.html">Music</a>
        <a href="payments.html">Wallet</a>
        <a href="community.html">Community</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="auth.html">Login</a>
      </nav>
    </header>

    <main class="reader-container">
      <!-- Breadcrumb & Reader Controls Bar -->
      <div class="reader-top-bar">
        <nav class="wiki-breadcrumbs">
          <a href="index.html">Home</a> <span>/</span>
          <a href="stories.html">Chronicles</a> <span>/</span>
          <span id="storyBreadcrumb">Story Reader</span>
        </nav>
        <div class="reader-controls">
          <button type="button" class="reader-ctrl-btn" id="fontDec" title="Smaller font">A-</button>
          <button type="button" class="reader-ctrl-btn" id="fontInc" title="Larger font">A+</button>
        </div>
      </div>

      <!-- Main Prose Reader -->
      <article class="reader-sheet">
        <header class="reader-sheet-header">
          <span class="auth-brand-badge" id="chapterArcBadge">ARC I · ORIGINAL FICTION</span>
          <h1 id="chapterTitle">Chapter 1</h1>
          <p class="reader-author" id="readerAuthor">Written by <strong>Abhishek Rai</strong></p>
        </header>

        <div class="reader-text" id="chapterBody">
          <!-- Dynamically populated from stored stories -->
        </div>

        <nav class="reader-nav-bottom">
          <a class="button" href="stories.html">← Back to Chronicles</a>
          <button class="button primary" id="nextChapterBtn" type="button">Next Chapter <b>↗</b></button>
        </nav>
      </article>
    </main>

    <footer>
      <a class="brand" href="index.html">ar<span>rai</span>.in</a>
      <p>© 2026 Abhishek Rai. All rights reserved.</p>
      <div><a href="privacy.html">Privacy</a><a href="privacy.html#terms">Terms</a></div>
    </footer>

    <script>
      let currentFontSize = 18;
      const chapterBody = document.querySelector("#chapterBody");
      document.querySelector("#fontInc")?.addEventListener("click", () => {
        if (currentFontSize < 28) {
          currentFontSize += 2;
          chapterBody.style.fontSize = `${currentFontSize}px`;
        }
      });
      document.querySelector("#fontDec")?.addEventListener("click", () => {
        if (currentFontSize > 14) {
          currentFontSize -= 2;
          chapterBody.style.fontSize = `${currentFontSize}px`;
        }
      });

      // Dynamic Story Loader
      const params = new URLSearchParams(window.location.search);
      const storyId = params.get("story");
      const chapterNum = params.get("chapter") || "1";

      let storedStories = [];
      try {
        const raw = localStorage.getItem("arrai_wiki_stories");
        if (raw) storedStories = JSON.parse(raw);
      } catch {}

      const foundStory = storyId ? storedStories.find((s) => s.id === storyId) : (storedStories[0] || null);

      if (foundStory) {
        document.title = `${foundStory.title} — Chapter ${chapterNum}`;
        document.querySelector("#storyBreadcrumb").textContent = foundStory.title;
        document.querySelector("#chapterArcBadge").textContent = foundStory.arc || "ARC I · ONGOING";
        document.querySelector("#chapterTitle").textContent = `${foundStory.title} — Chapter ${chapterNum}`;
        document.querySelector("#readerAuthor").innerHTML = `Setting &amp; Universe: <strong>${foundStory.meta || "Abhishek Rai"}</strong>`;
        
        chapterBody.innerHTML = `
          <p class="story-synopsis-lead" style="font-size: 1.15rem; color: var(--sky); margin-bottom: 24px; line-height: 1.7;">
            ${foundStory.synopsis}
          </p>
          <div style="padding: 24px; border-radius: 16px; background: rgba(22, 34, 56, 0.6); border: 1px solid var(--line); line-height: 1.8;">
            <p>This original fiction chapter is registered under the <strong>${foundStory.title}</strong> saga in the ARRAI universe.</p>
            ${foundStory.tags?.length ? `<p style="margin-top: 8px;">Tags: ${foundStory.tags.map((t) => `<span class="wiki-tag" style="display:inline-block; margin:2px 4px 2px 0;">${t}</span>`).join(" ")}</p>` : ""}
            <p style="margin-top: 14px; font-size: 0.9rem; color: var(--muted);">New chapters can be added and edited anytime in the Universe Codex Studio.</p>
          </div>
        `;
      } else {
        document.title = "Story Reader — ARRAI Chronicles";
        document.querySelector("#storyBreadcrumb").textContent = "Story Reader";
        document.querySelector("#chapterArcBadge").textContent = "✦ ARRAI CHRONICLES";
        document.querySelector("#chapterTitle").textContent = "No Story Arc Selected";
        chapterBody.innerHTML = `
          <div style="padding: 36px 20px; text-align: center; border: 1px dashed var(--line); border-radius: 18px; background: rgba(22, 34, 56, 0.4);">
            <p style="color: var(--muted); margin-bottom: 20px;">No published story arc was found for this link. You can add original fiction and chapters anytime in your Universe Codex.</p>
            <a class="button primary" href="stories.html#stories">Go to Story Arcs ↗</a>
          </div>
        `;
        const nextBtn = document.querySelector("#nextChapterBtn");
        if (nextBtn) nextBtn.style.display = "none";
      }

      document.querySelector("#nextChapterBtn")?.addEventListener("click", () => {
        window.alert("Subsequent chapters are releasing in upcoming universe chronicles! Stay tuned.");
      });
    </script>
    <script src="script.js"></script>
  </body>
</html>
