<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music — arrai.in</title><link rel="stylesheet" href="style.css"></head><body class="music-page"><header><a class="brand" href="index.html">ar<span>rai</span>.in <b>✦</b></a><button class="menu-button">☰</button><nav><a href="index.html">Home</a><a href="community.html">Community</a><a class="active" href="music.html">Music</a><a href="chess.html">Chess</a><a href="payments.html">Payments</a></nav></header><main class="music-wrap"><section class="page-hero"><p class="eyebrow">Arrai music room</p><h1>Listen to something<br><em>beautiful.</em></h1><p>Search songs, music videos and creator sounds. Upload your own work with complete credits.</p></section><section class="music-toolbar"><input id="musicSearch" class="social-input" type="search" placeholder="Search song, artist, team or uploader…"><button class="button" id="stopMusic" type="button">Stop listening</button><a class="button primary" href="#musicUpload">＋ Upload</a></section><section id="musicStatus" class="community-status">Loading music…</section><section id="musicGrid" class="music-grid"></section><section class="social-card music-upload" id="musicUpload"><p class="eyebrow">Share your sound</p><h2>Upload music or video</h2><form id="musicForm" class="social-form music-form"><label>Song / video title<input name="title" required maxlength="120"></label><label>Artist name<input name="artist" required maxlength="100"></label><label>Team / label<input name="team" maxlength="100"></label><label>Description<textarea name="description" maxlength="400"></textarea></label><label>Audio or video file<input name="file" type="file" accept="audio/*,video/mp4,video/webm" required></label><button class="button primary" type="submit">Upload to music room ↗</button></form></section></main><div class="music-player" id="musicPlayer" hidden><img id="playerArt" src="assets/app-icon.svg" alt=""><div><
